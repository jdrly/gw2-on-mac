# Checks every pull request and every push to main on GitHub's runners, so none of it runs on my
# Mac: the scripts and workflows lint clean, the app builds, the sandbox suite passes on the built
# app and the windows render. No secrets and read-only access. Signing with my Developer ID,
# notarizing and releasing stay on my Mac (scripts/release.sh); dev builds are devbuild.yml.
#
# A runner has no development workspace, so scripts/stage-components.sh fetches prebuilt/ as the
# archive pinned in prebuilt.lock and checks its sha256 (README.md, Building).
#
# The Dev build workflow (devbuild.yml) calls the same jobs with the components it staged
# (components: the name of an artifact of its run with prebuilt.tar) and the version to build.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      components:
        description: An artifact of the calling run with prebuilt.tar; empty fetches prebuilt.lock's archive
        type: string
        default: ""
      version:
        description: GW2_ON_MAC_VERSION for build.sh; empty is build.sh's own
        type: string
        default: ""

permissions:
  contents: read

# (github.workflow is the caller's name when called, so a dev build's Checks don't cancel the pull
# request's own)
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # (scripts/build-addon.sh is zsh, which shellcheck can't read)
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 grep -l --null -m1 '^#!/bin/bash' | xargs -0 shellcheck -S warning

      - name: actionlint
        run: |
          v=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sha  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The game's compatdb rules as gw2om.sh writes them (scripts/compatdb-check/rules, which
  # test-sandbox.sh pins), read strictly with the crate Mach9 0.3.1's compatdb.so is built from
  compatdb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: compatdb-core reads each rules text and writes it back byte for byte
        run: cargo run --locked --manifest-path scripts/compatdb-check/Cargo.toml -- scripts/compatdb-check/rules/*.rules

  build:
    # build.sh needs the macOS 27 SDK. GitHub has no macos-27 label; its macOS 27 image with
    # Xcode 27 is xcode-27, a public preview (actions/runner-images#14404;
    # .github/actionlint.yaml lists it). Its default Xcode is 27.1; DEVELOPER_DIR picks 27.2,
    # the one I build releases with, so the runner's app is the same as mine.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts run under macOS's /bin/bash 3.2, so check their syntax with that one.
      - name: Syntax (bash 3.2, zsh)
        run: |
          git ls-files -z '*.sh' | xargs -0 grep -l --null -m1 '^#!/bin/bash' | xargs -0 -n 1 /bin/bash -n
          git ls-files -z '*.sh' | xargs -0 grep -l --null -m1 '^#!/bin/zsh' | xargs -0 -n 1 /bin/zsh -n

      - name: Fetch the components
        if: inputs.components == ''
        run: scripts/stage-components.sh --fetch

      # Until prebuilt.lock pins an archive with my arm64 DXMT (jdrly/dxmt#182), my ntdll.so and my
      # winemac.so (jdrly/wine's arm64-builds) and my FEX (jdrly/FEX's arm64-builds), stand-ins in
      # their layout for what it lacks: what the sandbox needs, never a release (scripts/release.sh
      # refuses them)
      - name: Stand-ins for the components prebuilt.lock doesn't pin
        if: inputs.components == ''
        run: scripts/stage-components.sh --standin

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.components != ''
        with:
          name: ${{ inputs.components }}
          path: ${{ runner.temp }}/components

      - name: The dev build's components
        if: inputs.components != ''
        run: tar -xf "$RUNNER_TEMP/components/prebuilt.tar" && cat prebuilt/STAGED

      - name: Build
        env:
          GW2_ON_MAC_VERSION: ${{ inputs.version }}
        run: ./build.sh

      # What to compare with a build of the same commit on my Mac
      - name: VERSIONS and the component hashes
        run: |
          apps=(dist/*.app); r="${apps[0]}/Contents/Resources"
          { echo '```'; cat "$r/VERSIONS"; echo; (cd "$r" && find components -type f | LC_ALL=C sort | xargs shasum -a 256); echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      # dist/ has the app and its file list (dist/<name>.files), which a dev build's DMG must match
      - name: Pack the app for the next jobs
        run: tar -cf "$RUNNER_TEMP/app.tar" dist .cache/sparkle-2.10.0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: ${{ runner.temp }}/app.tar
          retention-days: 7

      # The refusals change the files this job has finished with. A dev build has no archive, my
      # ntdll.so only with its wine_commit, my winemac.so only with its macdrv_commit and my FEX only
      # with its fex_commit.
      - name: build.sh refuses a changed component, stage-components.sh a changed archive
        env:
          ARCHIVE: ${{ inputs.components == '' }}
        run: |
          cp prebuilt/dxmt/aarch64-windows/d3d11.dll "$RUNNER_TEMP/d3d11.dll"
          printf x >>prebuilt/dxmt/aarch64-windows/d3d11.dll
          if ./build.sh >"$RUNNER_TEMP/build.txt" 2>&1; then echo "build.sh took a DXMT that isn't its record's"; exit 1; fi
          grep 'prebuilt/dxmt does not match its record' "$RUNNER_TEMP/build.txt"
          cp "$RUNNER_TEMP/d3d11.dll" prebuilt/dxmt/aarch64-windows/d3d11.dll
          echo extra >prebuilt/dxmt/i386-windows/d3d12.dll
          if ./build.sh >"$RUNNER_TEMP/build.txt" 2>&1; then echo "build.sh took a file the DXMT record doesn't name"; exit 1; fi
          grep "prebuilt/dxmt has files its record" "$RUNNER_TEMP/build.txt"
          rm prebuilt/dxmt/i386-windows/d3d12.dll
          if [ -d prebuilt/ntdll ]; then
            cp -R prebuilt/ntdll "$RUNNER_TEMP/ntdll"
            printf x >>prebuilt/ntdll/ntdll.so
            if ./build.sh >"$RUNNER_TEMP/build.txt" 2>&1; then echo "build.sh took an ntdll.so that isn't its record's"; exit 1; fi
            grep 'prebuilt/ntdll does not match its record' "$RUNNER_TEMP/build.txt"
            rm -rf prebuilt/ntdll && cp -R "$RUNNER_TEMP/ntdll" prebuilt/ntdll
          fi
          if [ -d prebuilt/macdrv ]; then
            cp -R prebuilt/macdrv "$RUNNER_TEMP/macdrv"
            printf x >>prebuilt/macdrv/winemac.so
            if ./build.sh >"$RUNNER_TEMP/build.txt" 2>&1; then echo "build.sh took a winemac.so that isn't its record's"; exit 1; fi
            grep 'prebuilt/macdrv does not match its record' "$RUNNER_TEMP/build.txt"
            rm -rf prebuilt/macdrv && cp -R "$RUNNER_TEMP/macdrv" prebuilt/macdrv
          fi
          if [ -d prebuilt/fex ]; then
            cp -R prebuilt/fex "$RUNNER_TEMP/fex"
            printf x >>prebuilt/fex/aarch64-unix/libarm64ecfex.so
            if ./build.sh >"$RUNNER_TEMP/build.txt" 2>&1; then echo "build.sh took a FEX that isn't its record's"; exit 1; fi
            grep 'prebuilt/fex does not match its record' "$RUNNER_TEMP/build.txt"
            rm -rf prebuilt/fex && cp -R "$RUNNER_TEMP/fex" prebuilt/fex
          fi
          printf 'not the addon' >prebuilt/ui-scale/version.dll
          if ./build.sh >"$RUNNER_TEMP/build.txt" 2>&1; then echo "build.sh took a changed version.dll"; exit 1; fi
          grep 'version.dll is not the addon' "$RUNNER_TEMP/build.txt"
          [ "$ARCHIVE" = true ] || exit 0
          # My ntdll.so and my winemac.so as pinned downloads (prebuilt.lock's ntdll_url and
          # ntdll_sha256, macdrv_url and macdrv_sha256), each in the layout of its jdrly/wine asset:
          # a signed dylib in place of the real file, which has no asset yet, and my Mac driver's
          # with win32u.so, as a build that has one lays it out. Staged with the right sha256s,
          # refused with another for either.
          engine_sha="$(sed -n 's/^ENGINE_SHA256=\([0-9a-f]*\).*/\1/p' src/gw2om.sh)"
          engine_wine="$(sed -n 's/^ENGINE_WINE=\([0-9a-f]*\).*/\1/p' src/gw2om.sh)"
          commit=1111111111111111111111111111111111111111
          sum() { shasum -a 256 "$1" | cut -d' ' -f1; }
          asset() { # <kind> <file...>: the archive <kind>-arm64-<commit>.tar.xz with the files; prints its path
            local d="$RUNNER_TEMP/$1-asset" k=$1 f
            shift
            mkdir -p "$d/files"
            for f in "$@"; do echo 'int gw2om_check;' | clang -x c -dynamiclib -o "$d/files/$f" -; done
            { echo "wine-11.21-0-g0000000"; echo "commit: $commit"; echo "base: $engine_wine"
              echo "engine: Mach9 v0.3.1 (wine-v0.3.1-macos-arm64.tar.xz, sha256 $engine_sha)"
              for f in "$@"; do echo "$f: sha256 $(sum "$d/files/$f")"; done; } >"$d/files/VERSION"
            echo "LGPL" >"$d/files/COPYING.LIB" && echo "Wine's LICENSE" >"$d/files/LICENSE"
            tar -cJf "$d/$k-arm64-$commit.tar.xz" -C "$d/files" "$@" VERSION COPYING.LIB LICENSE
            echo "$d/$k-arm64-$commit.tar.xz"
          }
          nt="$(asset ntdll ntdll.so)"
          md="$(asset macdrv winemac.so win32u.so)"
          other="$(echo other | shasum -a 256 | cut -d' ' -f1)"
          # My FEX as jdrly/FEX's asset fex-arm64-<commit>.tar.xz lays it out (its ARM64EC and WoW64
          # halves, VERSION, LICENSE, NOTICES): a signed dylib for each .so, a few bytes for each DLL
          fd="$RUNNER_TEMP/fex-asset"
          mkdir -p "$fd/files/aarch64-windows" "$fd/files/aarch64-unix"
          for h in arm64ec wow64; do
            echo "lib${h}fex.dll" >"$fd/files/aarch64-windows/lib${h}fex.dll"
            echo 'int gw2om_check;' | clang -x c -dynamiclib -o "$fd/files/aarch64-unix/lib${h}fex.so" -
          done
          { echo "FEX-2610-1-g1111111"; echo "commit: $commit"; echo "switches:"
            echo "base: 9d4fa4b46b1d8d834462a540539f37528883eec4 (FEX-2610-215-g9d4fa4b, athei/FEX, the tag engine-0.3.1)"
            echo "engine: Mach9 v0.3.1 (wine-v0.3.1-macos-arm64.tar.xz, sha256 $engine_sha)"
            for f in aarch64-windows/libarm64ecfex.dll aarch64-windows/libwow64fex.dll aarch64-unix/libarm64ecfex.so aarch64-unix/libwow64fex.so; do
              echo "$f: sha256 $(sum "$fd/files/$f")"
            done; } >"$fd/files/VERSION"
          echo "MIT" >"$fd/files/LICENSE" && echo "notices" >"$fd/files/NOTICES"
          tar -cJf "$fd/fex-arm64-$commit.tar.xz" -C "$fd/files" aarch64-windows aarch64-unix VERSION LICENSE NOTICES
          fx="$fd/fex-arm64-$commit.tar.xz"
          lock() { # <ntdll sha256> <macdrv sha256> <fex sha256>
            cat "$RUNNER_TEMP/prebuilt.lock"
            echo "ntdll_url=file://$nt"; echo "ntdll_sha256=$1"; echo "macdrv_url=file://$md"; echo "macdrv_sha256=$2"
            echo "fex_url=file://$fx"; echo "fex_sha256=$3"
          }
          cp prebuilt.lock "$RUNNER_TEMP/prebuilt.lock"
          lock "$(sum "$nt")" "$(sum "$md")" "$(sum "$fx")" >prebuilt.lock
          scripts/stage-components.sh --fetch
          cmp "$RUNNER_TEMP/ntdll-asset/files/ntdll.so" prebuilt/ntdll/ntdll.so
          cmp "$RUNNER_TEMP/macdrv-asset/files/winemac.so" prebuilt/macdrv/winemac.so
          cmp "$RUNNER_TEMP/macdrv-asset/files/win32u.so" prebuilt/macdrv/win32u.so
          cmp "$fd/files/aarch64-windows/libarm64ecfex.dll" prebuilt/fex/aarch64-windows/libarm64ecfex.dll
          cmp "$fd/files/aarch64-unix/libarm64ecfex.so" prebuilt/fex/aarch64-unix/libarm64ecfex.so
          # (its ARM64EC half only: the WoW64 half stays the engine's)
          [ "$(cd prebuilt/fex && find . -type f | LC_ALL=C sort | tr '\n' ' ')" = "./LICENSE ./NOTICES ./SHA256SUMS ./VERSION ./aarch64-unix/libarm64ecfex.so ./aarch64-windows/libarm64ecfex.dll " ]
          grep -x "commit: $commit" prebuilt/ntdll/VERSION prebuilt/macdrv/VERSION prebuilt/fex/VERSION
          grep "^ntdll $commit ntdll.so " prebuilt/STAGED
          grep "^macdrv $commit winemac.so [0-9a-f]* win32u.so " prebuilt/STAGED
          grep "^fex $commit libarm64ecfex.dll " prebuilt/STAGED
          lock "$other" "$(sum "$md")" "$(sum "$fx")" >prebuilt.lock
          if scripts/stage-components.sh --fetch >"$RUNNER_TEMP/stage.txt" 2>&1; then echo "stage-components.sh took an ntdll.so archive with another sha256"; exit 1; fi
          grep "ntdll-arm64-$commit.tar.xz does not match the sha256 in prebuilt.lock" "$RUNNER_TEMP/stage.txt"
          lock "$(sum "$nt")" "$other" "$(sum "$fx")" >prebuilt.lock
          if scripts/stage-components.sh --fetch >"$RUNNER_TEMP/stage.txt" 2>&1; then echo "stage-components.sh took a winemac.so archive with another sha256"; exit 1; fi
          grep "macdrv-arm64-$commit.tar.xz does not match the sha256 in prebuilt.lock" "$RUNNER_TEMP/stage.txt"
          lock "$(sum "$nt")" "$(sum "$md")" "$other" >prebuilt.lock
          if scripts/stage-components.sh --fetch >"$RUNNER_TEMP/stage.txt" 2>&1; then echo "stage-components.sh took a FEX archive with another sha256"; exit 1; fi
          grep "fex-arm64-$commit.tar.xz does not match the sha256 in prebuilt.lock" "$RUNNER_TEMP/stage.txt"
          # A FEX archive whose VERSION names another engine or another base, pinned by its own
          # sha256: refused after the download, before anything is staged
          for what in engine base; do
            rm -rf "$fd/odd" && cp -R "$fd/files" "$fd/odd"
            case "$what" in
              engine) sed -i '' -E "s/^(engine: .*sha256 )[0-9a-f]{64}/\1$other/" "$fd/odd/VERSION"; want="names another engine than ENGINE_SHA256" ;;
              base) sed -i '' "s/^base: .*/base: 1111111111111111111111111111111111111111/" "$fd/odd/VERSION"; want="names another base than ENGINE_FEX" ;;
            esac
            mkdir -p "$fd/$what" && tar -cJf "$fd/$what/fex-arm64-$commit.tar.xz" -C "$fd/odd" aarch64-windows aarch64-unix VERSION LICENSE NOTICES
            { lock "$(sum "$nt")" "$(sum "$md")" "$(sum "$fd/$what/fex-arm64-$commit.tar.xz")" | sed "s|^fex_url=.*|fex_url=file://$fd/$what/fex-arm64-$commit.tar.xz|"; } >prebuilt.lock
            if scripts/stage-components.sh --fetch >"$RUNNER_TEMP/stage.txt" 2>&1; then echo "stage-components.sh took a FEX for another $what"; exit 1; fi
            grep "$want" "$RUNNER_TEMP/stage.txt"
          done
          # A Mac driver archive whose VERSION names a win32u.so it doesn't have: refused
          ma="$RUNNER_TEMP/macdrv-asset"
          rm -rf "$ma/odd" && cp -R "$ma/files" "$ma/odd" && rm "$ma/odd/win32u.so"
          mkdir -p "$ma/nowin32u" && tar -cJf "$ma/nowin32u/macdrv-arm64-$commit.tar.xz" -C "$ma/odd" winemac.so VERSION COPYING.LIB LICENSE
          { lock "$(sum "$nt")" "$(sum "$ma/nowin32u/macdrv-arm64-$commit.tar.xz")" "$(sum "$fx")" | sed "s|^macdrv_url=.*|macdrv_url=file://$ma/nowin32u/macdrv-arm64-$commit.tar.xz|"; } >prebuilt.lock
          if scripts/stage-components.sh --fetch >"$RUNNER_TEMP/stage.txt" 2>&1; then echo "stage-components.sh took a Mac driver without the win32u.so its VERSION names"; exit 1; fi
          grep "missing .*/win32u.so" "$RUNNER_TEMP/stage.txt"
          cp "$RUNNER_TEMP/prebuilt.lock" prebuilt.lock
          archive=".cache/$(sed -n 's/^sha256=//p' prebuilt.lock)/$(sed -n 's/^file=//p' prebuilt.lock)"
          printf x >>"$archive"
          if scripts/stage-components.sh --fetch >"$RUNNER_TEMP/stage.txt" 2>&1; then echo "stage-components.sh took a changed archive"; exit 1; fi
          grep 'does not match the sha256 in prebuilt.lock' "$RUNNER_TEMP/stage.txt"

  sandbox:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: ${{ runner.temp }}

      - name: Unpack the app
        run: tar -xf "$RUNNER_TEMP/app.tar"

      # The checks that need files from my development workspace (the ArenaNet-signed installer,
      # the real arcdps) or more CPUs than the runner's 3 (ncpu 6 and 8) say "skip" and pass;
      # each skip is a notice on the run.
      - name: test-sandbox.sh
        run: |
          rc=0
          scripts/test-sandbox.sh 2>&1 | tee "$RUNNER_TEMP/sandbox.txt" || rc=$?
          grep -E '^ +skip' "$RUNNER_TEMP/sandbox.txt" | sed 's/^ *skip */::notice title=sandbox skip::/' || true
          exit "$rc"

      # After a failed check: the first one in the summary, and the checks' files as an artifact
      # (each check's gw2om.sh output; a failed one's session, settings, state, logs and the
      # stand-in's log, which hold no secret: the sandbox has none)
      - name: The first failed check
        if: failure()
        run: if [ -f work/app-sandbox/test.failed/summary.md ]; then cat work/app-sandbox/test.failed/summary.md >>"$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sandbox-checks
          path: work/app-sandbox/test.failed
          if-no-files-found: ignore
          retention-days: 14

  renders:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: ${{ runner.temp }}

      - name: Unpack the app
        run: tar -xf "$RUNNER_TEMP/app.tar"

      - name: ui-render.sh
        run: scripts/ui-render.sh "$RUNNER_TEMP/renders"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renders
          path: ${{ runner.temp }}/renders/*.png
          if-no-files-found: error
          retention-days: 14

  # The jobs above take the addon's version.dll prebuilt from the components archive, so on a pull
  # request this is the one job that compiles addon/ui-scale and runs its native test
  # (addon/ui-scale/test/test.c), with Homebrew's mingw-w64, the toolchain the shipped addon is
  # built with. In a dev build it runs too, next to the components job's build of the same commit.
  addon:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw-w64
        run: |
          brew install mingw-w64
          brew list --versions mingw-w64
          x86_64-w64-mingw32-gcc --version

      - name: build-addon.sh
        run: OUT="$RUNNER_TEMP/addon" scripts/build-addon.sh

      - name: The native test's log
        run: cat "$RUNNER_TEMP/addon/test.log"
