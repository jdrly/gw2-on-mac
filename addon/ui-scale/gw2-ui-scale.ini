; gw2-on-mac ui-scale: a larger "Larger" Interface Size, read when the game starts.
; Delete version.dll from the game folder to remove it (scripts/ui-scale-addon.zsh uninstall).
[ui-scale]
; 0 writes nothing (it only logs the font table and its plan); delete version.dll to remove it.
enabled=1
; Larger's target interface scale. Normal is 1.0, Larger normally 1.222 (22/18). The game only has
; pre-rendered fonts at certain sizes, so the nearest is used: 1.75 gives 30/18 = 1.667 (2304x1296
; at 4K), 1.8 gives 33/18 = 1.833, 2.0 gives 37/18 = 2.056. Text follows by the same ratio, up to
; the largest font the game has.
scale=1.75
; The small UI font (chat, tracker, labels, skill keys) has no size above Larger's. cronos draws it
; in GW2's Cronos face at the larger size (sharp); keep leaves it at Larger's size.
sans=cronos
; Font indices (1-13) to leave at Larger's own font, comma-separated: 6 is chat and nameplate
; names/titles, 1 and 3 the tracker and most labels, 5 small Cronos (menus). Font 0 sets the
; scale and can't be kept.
keep=
; Story cinematics' dialogue (the cinema engine's own text) sizes itself by font height / interface
; scale, so it stays at Normal's size at every Interface Size. 1 draws it at its font's own pixel
; size, sharp, like the rest of the UI (a 7-byte code detour; no change at Normal); 0 leaves it.
cinema=1
