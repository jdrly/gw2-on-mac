# Reads the compatdb rules gw2om.sh writes (rules/*.rules, which test-sandbox.sh pins) with the
# crate Mach9 0.4.0's compatdb.so is built from, strictly, and checks that each writes back byte
# for byte. Runs in CI (.github/workflows/checks.yml), never in the app's build.
#
#   cargo run --manifest-path scripts/compatdb-check/Cargo.toml -- scripts/compatdb-check/rules/*.rules
[package]
name = "compatdb-check"
version = "0.0.0"
edition = "2024"
publish = false

# (its own workspace, so cargo looks for none above it)
[workspace]

[dependencies]
# athei/mach9 at v0.4.0, the engine's release
compatdb-core = { git = "https://github.com/athei/mach9", rev = "cc71942acedec93aa48c98fcdba73ddf0f383399" }
